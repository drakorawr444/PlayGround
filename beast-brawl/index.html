<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071a16">
  <meta name="description" content="Beast Brawl - a wild 3D jungle battle royale.">
  <title>Beast Brawl — Jungle Royale</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23c6ff4a%22/><text y=%2270%22 x=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 font-family=%22Arial Black%22 fill=%22%23071a16%22>B</text></svg>">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="Beast Brawl 3D scene"></canvas>
    <div class="scene-shade"></div>
    <div class="scene-grain"></div>

    <div id="menu-ui" class="menu-ui">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark"><span>B</span></div>
          <div class="brand-copy">
            <strong>BEAST BRAWL</strong>
            <small>JUNGLE ROYALE</small>
          </div>
        </div>
        <div class="topbar-spacer"></div>
        <button class="profile-chip" data-action="profile" aria-label="Player profile">
          <span class="profile-avatar" id="profile-avatar">R</span>
          <span class="profile-info">
            <strong id="profile-name">Rookie</strong>
            <small><span id="profile-level">LV 1</span><span class="dot"></span><span id="profile-trophies">0</span> <span class="tiny-trophy">★</span></small>
          </span>
          <span class="profile-xp"><span id="profile-xp-fill"></span></span>
        </button>
        <div class="currency-row" id="currency-row"></div>
        <button class="icon-btn top-settings" data-action="settings" aria-label="Settings" id="settings-btn"></button>
      </header>

      <aside class="side-nav" id="side-nav" aria-label="Main navigation"></aside>
      <main class="page" id="page"></main>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
    </div>

    <div id="battle-ui" class="battle-ui hidden"></div>
    <div id="modal-root" class="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <div id="loading-screen" class="loading-screen hidden">
      <div class="loading-logo"><span>B</span></div>
      <div class="loading-title">BEAST BRAWL</div>
      <div class="loading-bar"><span></span></div>
      <div class="loading-copy">Dropping into the jungle...</div>
    </div>
    <div id="flash" class="flash"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
